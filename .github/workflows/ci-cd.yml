name: React CI/CD

on:
  push:
    branches: [master]

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci


      - name: Build
        run: npm run build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/reactjs-devop8-template:${{ github.sha }}

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: hongggf/reactjs-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update image tag in GitOps repository
        working-directory: gitops
        run: |
          sed -i "s#image: docker.io/hong16/reactjs-devop8-template:.*#image: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/reactjs-devop8-template:${{ github.sha }}#" k8s/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "Update React image to ${{ github.sha }}" || exit 0
          git push
